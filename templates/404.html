<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada | Cadena Gastronómica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            text-align: center;
            padding: 1.5rem;
        }
        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 3rem 2rem;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .error-code {
            font-size: 5.5rem;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
            color: #f1f5f9;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .btn-home {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.2s;
        }
        .btn-home:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Mesa o Página no encontrada</h1>
        <p>La dirección a la que intentas acceder no existe en el sistema de reservas o ha cambiado de lugar.</p>
        <a href="/" class="btn-home">Volver al Inicio</a>
    </div>
</body>
</html>
